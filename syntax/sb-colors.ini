;
; SB4 — Colores de sintaxis configurables
;
; Este archivo se usa cuando no hay un krauber.ini en la carpeta SB4.
; Para personalizar: copia esta sección y edítala, o configura
; la setting "sb4.colors.iniPath" con la ruta a tu archivo (por ejemplo
; tu propio krauber.ini de Sanny Builder 4).
;
; Formato (igual que krauber.ini, sección [syntax]):
;   <categoria>.color            = #RRGGBB  o  entero estilo SB4 (0xRRGGBB)
;   <categoria>.style.bold       = 0 | 1
;   <categoria>.style.italic     = 0 | 1
;   <categoria>.style.underline  = 0 | 1
;
; Categorías: keywords, numbers, strings, classes, commands, enums,
; variables, labels, comments, directives, constants, models.
;
[syntax]
keywords.color = #AB76A6
keywords.style.bold = 1
keywords.style.italic = 0
keywords.style.underline = 0

numbers.color = #B8D7A3
numbers.style.bold = 0
numbers.style.italic = 0
numbers.style.underline = 0

strings.color = #BF815D
strings.style.bold = 0
strings.style.italic = 0
strings.style.underline = 0

classes.color = #4AAE98
classes.style.bold = 0
classes.style.italic = 0
classes.style.underline = 0

commands.color = #DBDCAC
commands.style.bold = 0
commands.style.italic = 0
commands.style.underline = 0

enums.color = #B8D7A3
enums.style.bold = 0
enums.style.italic = 0
enums.style.underline = 0

variables.color = #98CFE6
variables.style.bold = 0
variables.style.italic = 0
variables.style.underline = 0

labels.color = #DBDCAC
labels.style.bold = 1
labels.style.italic = 0
labels.style.underline = 0

comments.color = #6A9955
comments.style.bold = 0
comments.style.italic = 1
comments.style.underline = 0

directives.color = #FFFF00
directives.style.bold = 0
directives.style.italic = 1
directives.style.underline = 0

constants.color = #DBDCAC
constants.style.bold = 0
constants.style.italic = 0
constants.style.underline = 0

models.color = #B8D7A3
models.style.bold = 0
models.style.italic = 0
models.style.underline = 0